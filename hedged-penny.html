<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hedged Penny</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090f;--c:#0f131d;--tx:#f4efe2;--mu:#8b92a7;--bd:#232a3a;--g1:#f3d98b;--g2:#b8862b;--em:#5fbf9a;--cy:#e8dfc8;--er:#f87171;--wa:#e6b955;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f3ea;--c:#fff;--tx:#1a1710;--mu:#7a746a;--bd:#e6dfcc}}
:root[data-theme="light"]{--bg:#f6f3ea;--c:#fff;--tx:#1a1710;--mu:#7a746a;--bd:#e6dfcc}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:radial-gradient(900px 380px at 50% -120px,#d4af3726,transparent),var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif}
header{padding:16px 16px 2px;font:700 22px "Playfair Display",Georgia,serif}
.gt{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;scrollbar-width:none}
nav button{flex:none;border:1px solid var(--bd);background:var(--c);color:var(--mu);padding:7px 13px;border-radius:99px;font-size:12.5px}
nav button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#1a1305;border-color:transparent;font-weight:600}
main{padding:6px 16px 48px;max-width:640px;margin:auto}
.c{background:var(--c);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 8px 30px #0002}
.cc{position:relative;overflow:hidden;border-radius:22px;padding:20px;margin-bottom:12px;color:#f4efe2;background:linear-gradient(135deg,#232734,#0a0c13 60%,#2a2210);border:1px solid #d4af3766;box-shadow:0 14px 40px #0006}
.cc:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-radial-gradient(circle at 92% 8%,#d4af3720 0 1px,transparent 1px 8px)}.holo{width:36px;height:36px;border-radius:50%;background:conic-gradient(#f3d98b,#e8dfc8,#5fbf9a,#d9776f,#f3d98b);opacity:.85;box-shadow:0 0 12px #d4af3766,inset 0 0 0 3px #0006}.cc:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,#fff3 50%,transparent 60%);transform:translateX(-100%);animation:sh 5s infinite}
@keyframes sh{to{transform:translateX(100%)}}@keyframes pp{from{transform:scale(.6);opacity:0}}
.ch{width:54px;height:40px;border-radius:8px;background:linear-gradient(90deg,transparent 32%,#0004 33% 34%,transparent 35% 65%,#0004 66% 67%,transparent 68%),linear-gradient(0deg,transparent 32%,#0004 33% 34%,transparent 35% 65%,#0004 66% 67%,transparent 68%),linear-gradient(135deg,#f3d98b,#b8862b);border:1px solid #0005;box-shadow:inset 0 0 0 3px #fff3}
.r2{display:flex;justify-content:space-between;align-items:center;gap:12px}
.big{font:700 32px "Playfair Display",Georgia,serif}.mu{color:var(--mu);font-size:12.5px}
h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin:0 0 10px}
.g3,.g2{display:grid;gap:8px;margin-bottom:12px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
.t{background:var(--c);border:1px solid var(--bd);border-radius:16px;padding:12px;text-align:center}.t b{display:block;font-size:16px;margin-top:2px}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;margin:4px 0 10px}
input[type=range]{padding:0;accent-color:var(--g2)}
.b{width:100%;border:0;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#1a1305;font-weight:700;font-size:15px}
.b.r{background:linear-gradient(135deg,#c9954f,#d9776f);color:#fff}.b.o{background:none;color:var(--tx);border:1px solid var(--bd);margin-top:8px}.b:disabled{opacity:.4}
.q{flex:1;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:8px}.chips{display:flex;gap:6px;margin-bottom:10px}
.tag{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:700}.ok{background:#064e3b;color:#6ee7b7}.pe{background:#4a3a0a;color:#fcd34d}.pn{background:#4c1519;color:#fca5a5}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.av{width:34px;height:34px;border-radius:50%;border:1px solid var(--g2);display:grid;place-items:center;color:var(--g1);flex:none}
.ban{border-radius:14px;padding:12px;margin-bottom:12px;font-size:13px;border:1px solid}.ban.w{background:#3a2f0e;color:#fcd34d;border-color:#8a6a10}.ban.e{background:#3b1517;color:#fca5a5;border-color:#a33}.ban.s{background:#063a2c;color:#6ee7b7;border-color:#0a7a5a}
.rg{position:relative;flex:none}.rg svg{width:100%;height:100%}.rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.rc b{font:700 28px Georgia,serif}.rc span{font-size:9px;letter-spacing:.15em;color:var(--mu)}
.bars{display:flex;align-items:flex-end;gap:8px;height:90px}.bars i{flex:1;background:linear-gradient(var(--g1),var(--g2));border-radius:6px 6px 0 0;min-height:3px}
.seg{display:flex;background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:4px}.seg button{flex:1;border:0;background:none;color:var(--mu);padding:10px;border-radius:99px}.seg .on{background:var(--cy);color:#04121f;font-weight:700}
.chip{position:absolute;left:6px;top:4px;background:#0b0f19ee;border:1px solid var(--bd);border-radius:12px;padding:6px 10px;font-size:11px;color:#eee}
.pz{border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:38px;height:38px;border-radius:50%;flex:none}
.pop{animation:pp .5s}.ck{width:72px;height:72px;border-radius:50%;margin:8px auto;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#1a1305;animation:pp .6s}
.sw{position:relative;margin-top:12px}.sw input{height:56px;-webkit-appearance:none;appearance:none;background:linear-gradient(90deg,#d4af3744,transparent);border:1px solid var(--g2);border-radius:99px;margin:0}
.sw input::-webkit-slider-thumb{-webkit-appearance:none;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2))}.sw span{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--g1);font-size:13px;padding-left:40px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="gG" x1="0" x2="1"><stop offset="0" stop-color="#f3d98b"/><stop offset="1" stop-color="#b8862b"/></linearGradient>
<linearGradient id="gE" x1="0" x2="1"><stop offset="0" stop-color="#5fbf9a"/><stop offset="1" stop-color="#e8dfc8"/></linearGradient>
<linearGradient id="gR" x1="0" x2="1"><stop offset="0" stop-color="#c9954f"/><stop offset="1" stop-color="#d9776f"/></linearGradient>
<linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4af37" stop-opacity=".4"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/></linearGradient>
<linearGradient id="gB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fbf9a" stop-opacity=".35"/><stop offset="1" stop-color="#5fbf9a" stop-opacity="0"/></linearGradient>
</defs></svg>
<header id="ht"></header><nav id="nav"></nav><main id="m"></main>
<script>
const $=x=>document.getElementById(x),fm=n=>'₹'+(+n).toLocaleString('en-IN',{maximumFractionDigits:2});
const FXSP=.0001,RATE=.0447,LOCK=90,CAP=7e6,PEN=.015,DET=6140000,CUM=[8.2,14,26.5,33,45.2,54.8,61.4].map(x=>x*1e5);
function slice(T){if(T%5)return Math.ceil(T/10)*10-T;return T<=200?Math.max(T*.05,5):Math.min(T*.03,15)}
const AM=[120,47,500,123,20,85,250,60,150,35,300,95,1000,18,75,210,49,130],VN=['Chai Point','Kirana Store','Petrol Pump','Auto Fare','Tea Stall','Rent Share','Bakery','Swiggy','Cab','Metro Card'];
const S={tab:'kyc',kyc:false,id:null,liq:null,wd:null,pause:false,sb:null,wi:350000,flt:'all',pen:false,fx:88,fd:0,lg:0,ci:0,L:[],st:Array.from({length:24},()=>3+Math.random()*8)};
let k=0;for(let d=34;d>=0;d--)for(let j=0;j<(d%3?1:2);j++){const a=AM[k%AM.length];S.L.push({id:'TX-'+(1000+k),amt:a,v:VN[k%VN.length],d,mode:k%3?'UPI':'NetBanking',sl:slice(a),st:(k%19==7||(d==0&&j==1))?'pending':'approved'});k++}
const appr=()=>S.L.filter(x=>x.st=='approved'&&!x.w),principal=()=>appr().reduce((s,x)=>s+x.sl,0),interest=()=>appr().reduce((s,x)=>s+x.sl*RATE*x.d/365,0),day=()=>Math.max(0,...S.L.map(x=>x.d))+1;
const sbv=()=>S.sb||(S.sb=lp()),lp=()=>{if(!appr().length)return{sl:0,sw:0,tg:0};const n=appr().length||1;return{sl:+(principal()/n).toFixed(1),sw:+(n/day()).toFixed(1),tg:600}};
const pts=(a,w,h,p=8)=>{const mn=Math.min(...a),mx=Math.max(...a);return a.map((v,i)=>[p+i*(w-2*p)/Math.max(1,a.length-1),h-p-(v-mn)/((mx-mn)||1)*(h-2*p)])};
const cv=p=>p.map((q,i)=>i?'Q'+p[i-1][0]+' '+p[i-1][1]+' '+(p[i-1][0]+q[0])/2+' '+(p[i-1][1]+q[1])/2:'M'+q[0]+' '+q[1]).join('')+'L'+p.at(-1)[0]+' '+p.at(-1)[1];
const area=(a,w,hh,xl,u=fm)=>{const L=42,B=16,mn=Math.min(...a),mx=Math.max(...a),r=(mx-mn)||1,X=i=>L+i*(w-L-8)/Math.max(1,a.length-1),Y=v=>8+(hh-8-B)*(1-(v-mn)/r),q=a.map((v,i)=>[X(i),Y(v)]),d=cv(q),z=q.at(-1);return `<svg viewBox="0 0 ${w} ${hh}" width="100%">${[0,1,2,3].map(f=>{const v=mn+r*f/3;return `<line x1="${L}" x2="${w-8}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--bd)"/><text x="2" y="${Y(v)+3}" font-size="8" fill="var(--mu)">${u(v)}</text>`}).join('')}<path d="${d}L${w-8} ${hh-B}L${L} ${hh-B}Z" fill="url(#gA)"/><path d="${d}" fill="none" stroke="url(#gG)" stroke-width="2.2"/>${q.filter((_,i)=>i%Math.ceil(q.length/12)==0).map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.2" fill="#f3d98b"/>`).join('')}${xl.map(([i,t])=>`<text x="${X(i)}" y="${hh-3}" font-size="8" fill="var(--mu)" text-anchor="middle">${t}</text>`).join('')}<circle cx="${z[0]}" cy="${z[1]}" r="4" fill="#fff"><animate attributeName="r" values="3;6;3" dur="1.4s" repeatCount="indefinite"/></circle></svg>`};
const ring=(p,g,big,sm,z)=>`<div class="rg" style="width:${z}px;height:${z}px"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--bd)" stroke-width="9"/><circle cx="60" cy="60" r="52" fill="none" stroke="url(#${g})" stroke-width="9" stroke-linecap="round" stroke-dasharray="${Math.min(1,p)*326.7} 327" transform="rotate(-90 60 60)" style="filter:drop-shadow(0 0 5px #d4af3777)"/></svg><div class="rc"><b>${big}</b><span>${sm}</span></div></div>`;
const lr=()=>{const f=sbv(),app=principal()+f.sl*f.sw*30.4*12,tot=DET+S.wi+app,ex=Math.max(0,tot-CAP);return{app,tot,ex,tcs:ex*.2,pct:tot/CAP,st:tot>CAP?'o':tot>CAP*.9?'w':'s'}};
const lockBan=()=>S.kyc?'':`<div class="ban w">🔒 Payments locked until KYC &amp; UPI is <b>Approved</b>. <a href="#" style="color:inherit" onclick="go('kyc');return false">Verify now</a></div>`;
const lrsBan=()=>{const r=lr();return r.st=='o'?`<div class="ban e">⛔ Projected LRS crosses the cap by ${fm(r.ex)} → TCS ${fm(r.tcs)}. Batches will pause.</div>`:r.st=='w'?`<div class="ban w">⚠ LRS watch: ${fm(CAP-r.tot)} headroom left this FY. <a href="#" style="color:inherit" onclick="go('lrs');return false">Details</a></div>`:''};
const rw=x=>{const c={approved:'ok',pending:'pe',penalty:'pn'}[x.st],n={approved:'Approved',pending:'Unapproved',penalty:'Penalty'}[x.st];return `<div class="row"><div class="r2"><span class="av">${x.v[0]}</span><div><b>${x.v}</b> <span class="tag ${c}">${n}</span><div class="mu">${x.id} · ${x.d?x.d+'d ago':'Today'} · ${x.mode}${x.w?' · withdrawn':''}</div></div></div><div style="text-align:right">${x.st=='penalty'?`<b style="color:var(--er)">−${fm(-x.sl)}</b>`:`${fm(x.amt)}<div class="gt" style="font-size:12px">+${fm(x.sl)}</div>`}</div></div>`};
const CHIP=`<svg viewBox="0 0 64 48" width="68" height="51"><defs><linearGradient id="gC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe9b0"/><stop offset=".45" stop-color="#d9b25a"/><stop offset="1" stop-color="#8f6420"/></linearGradient></defs><rect x="1" y="1" width="62" height="46" rx="8" fill="url(#gC)" stroke="#5a3d10"/><g stroke="#5a3d10" stroke-width=".9" fill="none" opacity=".75"><rect x="21" y="14" width="22" height="20" rx="4"/><path d="M1 17h20M1 31h20M43 17h20M43 31h20M32 1v13M32 34v13M21 24h22M27 14v20M37 14v20"/></g><rect x="24" y="17" width="16" height="14" rx="3" fill="#fff" opacity=".2"/><path d="M6 6q8-3 20 0" stroke="#fff" stroke-opacity=".7" fill="none"/></svg>`;
const pzb=()=>`<button class="pz" onclick="S.pause=!S.pause;render()">${S.pause?'▶':'❚❚'}</button>`;
const V={
dash(){const p=principal(),i=interest(),d=Math.min(day(),LOCK),pays=S.L.filter(x=>x.st!='penalty'),tp=pays.reduce((s,x)=>s+x.amt,0),u=S.id?S.id.upi:'yourname@hedgedpenny';
return lockBan()+lrsBan()+`<div class="c r2" style="font-size:11px"><b class="gt">HDFC BANK</b><span style="flex:1;height:1px;background:linear-gradient(90deg,var(--g2),var(--g1))"></span><b class="gt">HEDGED PENNY</b><span style="flex:1;height:1px;background:linear-gradient(90deg,var(--g1),var(--g2))"></span><b class="gt">ALPACA</b></div><div class="mu" style="margin:-6px 4px 12px;font-size:11px">Illustrative partner wordmarks · UPI settlement → vault → US T-bills</div>
<div class="cc"><div class="r2">${CHIP}<div style="text-align:right"><div style="letter-spacing:.25em;font-size:11px;color:var(--g1)">HEDGED PENNY BLACK</div></div></div><div class="mu" style="margin-top:14px">PRINCIPAL ACCUMULATED</div><div class="big gt">${fm(p)}</div><div class="mu">+${fm(i)} T-Bill interest · ${(RATE*100).toFixed(2)}% p.a.</div><div class="r2" style="margin-top:6px"><span class="mu">${u}</span><span class="tag ${S.kyc?'ok':'pe'}">${S.kyc?'● VERIFIED':'○ UNVERIFIED'}</span></div></div>
<div class="g3"><div class="t"><span class="mu">Total slices</span><b>${pays.length}</b></div><div class="t"><span class="mu">Slices pending</span><b>${S.L.filter(x=>x.st=='pending').length}</b></div><div class="t"><span class="mu">Total payments</span><b>${fm(tp)}</b></div></div>
<div class="c"><h2>Growth of principal · 35 days</h2>${area(cum(),340,170,[[0,'35d ago'],[9,'26d'],[17,'18d'],[26,'9d'],[34,'Today']])}</div>
<div class="c r2">${ring(d/LOCK,'gE',day(),'OF 90 DAYS',120)}<div><b>${day()>LOCK?'Matured · 0% exit fee':'Lock-in active'}</b><div class="mu">${day()>LOCK?'Withdraw anytime, frictionless':Math.max(0,LOCK+1-day())+' days to zero-friction exit'}</div></div><div style="text-align:center"><button class="q" style="flex:none;padding:6px 14px;font-size:12px" onclick="wipe(0)">${S.rc?'Tap again to confirm reset':S.kyc?'↺ Reset data (KYC stays)':'↺ Reset demo'}</button></div></div>`},
kyc(){const I=S.id;return `<div class="c"><h2>Onboarding gate · KYC &amp; UPI bind</h2>${S.kyc?`<div class="cc"><div class="ch"></div><div class="big gt" style="margin-top:10px">Verified ✓</div><div class="mu">Aadhaar ${I.aa}</div><div class="mu">PAN ${I.pn}</div><div class="mu">UPI ${I.upi} · auto-debit mandate active</div></div>`:`<label class="mu">Aadhaar</label><input id="aa" inputmode="numeric" maxlength="14" placeholder="0000 0000 0000" oninput="fa(this)"><label class="mu">PAN</label><input id="pn" maxlength="10" placeholder="AAAAA0000A" oninput="fp(this)"><label class="mu">UPI ID</label><input id="up" placeholder="yourname@hedgedpenny"><button class="b" onclick="doKyc()">Verify &amp; bind</button><div id="ks" style="margin-top:10px"></div>`}<div style="text-align:center;margin-top:12px"><button class="q" style="flex:none;padding:6px 14px;font-size:12px" onclick="wipe(1)">${S.rc?'Tap again to wipe everything':'↺ Reset KYC &amp; UPI + all data'}</button></div></div>`},
pay(){return lockBan()+`<div class="c"><h2>Live payment · slice intercept</h2><label class="mu">Pay to (Merchant/Receiver)</label><input id="mv" value="Chai Point" placeholder="Shop, person or UPI ID"><label class="mu">Amount due (₹)</label><input id="pa" type="number" inputmode="decimal" value="120" oninput="pv()"><div class="chips">${[47,120,500,1000].map(a=>`<button class="q" onclick="$('pa').value=${a};pv()">₹${a}</button>`).join('')}</div><select id="pm"><option>UPI</option><option>NetBanking</option></select><div id="pp"></div><div id="pr"></div><button class="b" id="pb" onclick="doPay()" ${S.kyc?'':'disabled'}>Pay securely</button></div><div class="c mu">AVS: fractional → next ₹10 · flat ≤₹200 → max(5%, ₹5) · flat &gt;₹200 → min(3%, ₹15)</div>`},
led(){const f=S.flt,F=S.L.filter(x=>f=='all'||(f=='ap'&&x.st=='approved')||(f=='un'&&x.st=='pending')||(f=='pn'&&x.st=='penalty'));return `<div class="c"><h2>Ledger &amp; audit log</h2><div class="chips">${[['all','All',S.L.length],['ap','Approved',S.L.filter(x=>x.st=='approved').length],['un','Unapproved',S.L.filter(x=>x.st=='pending').length],['pn','Penalty',S.L.filter(x=>x.st=='penalty').length]].map(([a,b,n])=>`<button class="q" style="${f==a?'border-color:var(--g2);color:var(--g1)':''}" onclick="S.flt='${a}';render()">${b} (${n})</button>`).join('')}</div>${F.slice().reverse().map(rw).join('')||'<div class="mu">Nothing here.</div>'}</div>`},
avs(){const s=sbv();return `<div id="ax"></div><div class="c"><h2>Tweak factors</h2><label class="r2"><span>Average slice per swipe</span><b id="l1" class="gt">${fm(s.sl)}</b></label><input type="range" id="s1" min="0" max="50" step="0.1" value="${s.sl}" oninput="us()"><label class="r2"><span>Daily swipe frequency</span><b id="l2" class="gt">${s.sw}x / day</b></label><input type="range" id="s2" min="0" max="30" step="0.1" value="${s.sw}" oninput="us()"><label class="r2"><span>Monthly savings target</span><b id="l3" class="gt">${fm(s.tg)}</b></label><input type="range" id="s3" min="0" max="3000" step="50" value="${s.tg}" oninput="us()"><button class="b o" onclick="S.sb=null;render()">↺ Reset to Ledger Balance</button></div>`},
proj(){return `<div id="px"></div>`},
wd(){const p=principal(),i=interest(),mat=day()>LOCK,Q=S.liq,W=S.wd;
if(W)return `<div class="c" style="text-align:center"><div class="ck">✓</div><div class="big gt">${fm(W.net)}</div><div class="mu">credited to ${S.id?S.id.upi:'your UPI'}</div><div class="row"><span>Principal</span><b>${fm(W.p)}</b></div><div class="row"><span>T-Bill interest</span><b>+${fm(W.i)}</b></div><div class="row"><span>Exit fee</span><b>0%</b></div><div class="row"><span>Ref</span><b>${W.ref}</b></div><div class="mu">${W.t}</div></div>`;
if(Q)return `<div class="c"><h2>Early liquidation executed</h2><div class="big gt" id="lv">${fm(Q.net)}</div><div class="row"><span>Ledger principal</span><b>${fm(Q.p)}</b></div><div class="row"><span>Penalty (1.5%)</span><b style="color:var(--er)">−${fm(Q.pen)}</b></div><div class="row"><span>Interest forfeited</span><b style="color:var(--er)">−${fm(Q.i)}</b></div><div class="row"><span>Net payout to UPI</span><b>${fm(Q.net)}</b></div><button class="b o" onclick="location.reload()">Reset demo</button></div>`;
